[package]
name = "slidestage"
version = "0.1.2"
description = "SlideStage: estudio de slides em HTML com editor visual e de codigo"
authors = ["Kelvin"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "slidestage_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify = "7"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
